- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      sandbox-auto:
        sandbox: workspace-write
        approval: ask
        name: Sandbox Auto
        description: Workspace-sandboxed execution with automatic review and one-shot approval for wider access.
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- insert:
    - id: auto-permission-mode
      name: '@nanmicoder/dsh-auto-mode'
      config: {}
